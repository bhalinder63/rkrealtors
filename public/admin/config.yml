backend:
  name: github
  repo: bhalinder63/rkrealtors
  branch: main
  base_url: https://rkrealtors.vercel.app
  auth_endpoint: api/auth

local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: header
    label: Header
    files:
      - file: content/header.json
        name: header
        label: Header
        format: json
        fields:
          - label: Nav Links
            name: navLinks
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { label: Label, name: label, widget: string }
              - { label: 'Link (anchor on the page, e.g. #about)', name: href, widget: string }
          - { label: 'Call Button Text', name: ctaText, widget: string }

  - name: hero
    label: Hero
    files:
      - file: content/hero.json
        name: hero
        label: Hero
        format: json
        fields:
          - { label: 'Location Badge', name: badge, widget: string, hint: 'e.g. New Chandigarh · Chandigarh · Mohali · Patiala' }
          - { label: 'Heading — text before the highlighted name', name: headingPrefix, widget: string }
          - { label: 'Heading — highlighted name', name: headingHighlight, widget: string }
          - { label: Paragraph, name: paragraph, widget: text }
          - { label: 'Primary Button Text', name: primaryButtonText, widget: string, hint: 'links to Contact section' }
          - { label: 'Secondary Button Text', name: secondaryButtonText, widget: string, hint: 'links to Listings section' }

  - name: about
    label: About
    files:
      - file: content/about.json
        name: about
        label: About
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: 'Heading — text before the highlighted word', name: headingPrefix, widget: string }
          - { label: 'Heading — highlighted word', name: headingHighlight, widget: string }
          - { label: 'Paragraph 1', name: paragraph1, widget: text }
          - { label: 'Paragraph 2', name: paragraph2, widget: text }
          - label: Features
            name: features
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: desc, widget: string }

  - name: services
    label: Services
    files:
      - file: content/services.json
        name: services
        label: Services List
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: text }
          - label: Items
            name: items
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Number, name: mark, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: desc, widget: text }

  - name: listings
    label: Listings
    files:
      - file: content/listings.json
        name: listings
        label: Property Listings
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: 'Link Text', name: ctaText, widget: string, hint: 'links to Contact section' }
          - label: Items
            name: items
            widget: list
            summary: '{{fields.title}} — {{fields.price}}'
            fields:
              - { label: Category Tag, name: tag, widget: string, hint: 'e.g. Residential, Commercial, Villa, Flat, Farm House, Agriculture' }
              - { label: Title, name: title, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Details, name: meta, widget: string, hint: 'e.g. 500 sq yd · Corner plot · Fully renovated' }
              - { label: Price, name: price, widget: string }
              - { label: Photo, name: img, widget: image }

  - name: team
    label: Team
    files:
      - file: content/team.json
        name: team
        label: Team Members
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - label: Items
            name: items
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: 'Phone (shown on site)', name: phone, widget: string, hint: 'e.g. +91 98145 53349' }
              - { label: 'Phone link (tap-to-call)', name: tel, widget: string, hint: 'e.g. tel:+919814553349 — no spaces' }

  - name: contact
    label: Contact Section
    files:
      - file: content/contact.json
        name: contact
        label: Contact Section
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Paragraph, name: paragraph, widget: text }
          - { label: 'Map Placeholder — line 1', name: mapPlaceholderLine1, widget: string }
          - { label: 'Map Placeholder — line 2', name: mapPlaceholderLine2, widget: string }
          - { label: 'Submit Button Text', name: submitButtonText, widget: string }
          - { label: 'WhatsApp Note (phone number is added automatically after this text)', name: whatsappNote, widget: string }
          - { label: 'Success — Heading', name: successHeading, widget: string }
          - { label: 'Success — Paragraph', name: successParagraph, widget: text }
          - { label: 'Success — Button Text', name: successButtonText, widget: string }

  - name: footer
    label: Footer
    files:
      - file: content/footer.json
        name: footer
        label: Footer
        format: json
        fields:
          - { label: Description, name: description, widget: text }
          - { label: 'Quick Links Label', name: quickLinksLabel, widget: string }
          - { label: 'Reach Us Label', name: reachUsLabel, widget: string }
          - { label: 'Instagram Button Text', name: instagramLabel, widget: string }
          - { label: 'Bottom Tagline', name: tagline, widget: string }

  - name: settings
    label: Site Settings
    files:
      - file: content/settings.json
        name: settings
        label: General Settings
        format: json
        fields:
          - label: Hero Images
            name: heroImages
            widget: list
            field: { label: Image, name: image, widget: image }
          - label: About Section Image
            name: aboutImg
            widget: image
          - label: Stats
            name: stats
            widget: list
            summary: '{{fields.value}} — {{fields.label}}'
            fields:
              - { label: Value, name: value, widget: string, hint: 'e.g. 4, 7, 100%' }
              - { label: Label, name: label, widget: string }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: 'Ramandeep — Phone (shown on site)', name: ramandeepPhone, widget: string, hint: 'e.g. 9814553349' }
              - { label: 'Ramandeep — Phone link', name: ramandeepTel, widget: string, hint: 'e.g. tel:+919814553349' }
              - { label: 'Kamaldeep — Phone (shown on site)', name: kamaldeepPhone, widget: string }
              - { label: 'Kamaldeep — Phone link', name: kamaldeepTel, widget: string }
              - { label: WhatsApp Link, name: whatsapp, widget: string, hint: 'e.g. https://wa.me/919814553349' }
              - { label: Instagram Link, name: instagram, widget: string }
